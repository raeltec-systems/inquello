<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script><script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script><script src="../../components/preview-loader.js"></script></head><body style="margin:0;padding:20px 24px;background:#fff;box-sizing:border-box"><div id="root"></div><script type="text/babel">
IQ.ready.then(DS => { Object.assign(window, DS);
const Row = ({ label, children }) => <div style={{ display: 'grid', gridTemplateColumns: '92px minmax(0,1fr)', alignItems: 'center', gap: 12 }}><span style={{ font: 'var(--type-label)', letterSpacing: '.04em', color: 'var(--text-faint)', textTransform: 'uppercase' }}>{label}</span><div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>{children}</div></div>;
function Demo() { return <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
<Row label="Button"><Button variant="primary" kbd="⏎">Send request</Button><Button icon="external-link">Open in Excel</Button><Button variant="quiet" icon="git-compare">Changes</Button><Button variant="ghost">Leave open</Button><Button disabled>Disabled</Button></Row>
<Row label="Sizes"><Button size="sm">Small 26</Button><Button>Medium 28</Button><Button size="lg" variant="primary">Large 32</Button></Row>
<Row label="IconButton"><IconButton icon="panel-left" label="Sidebar" /><IconButton icon="panel-right" label="Side panel" active /><IconButton icon="maximize-2" label="Expand" variant="outline" /><IconButton icon="ellipsis" label="More" /><IconButton variant="send" label="Send" size={30} /><IconButton variant="stop" label="Stop" size={30} /></Row>
<Row label="Avatar"><Avatar initials="PR" /><Avatar initials="TO" tone="green" /><Avatar initials="AK" tone="amber" /><Avatar initials="PR" tone="decided" size={16} /><Avatar kind="agent" size={24} /></Row>
<Row label="Badge"><Badge>2</Badge><Badge tone="neutral">14</Badge><Badge tone="accent">New</Badge></Row>
<Row label="Icon">{['file-spreadsheet','file-text','folder','search','inbox','clock','terminal','git-compare','external-link','shield-check'].map(n => <Icon key={n} name={n} />)}</Row>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />); });
</script></body></html>
