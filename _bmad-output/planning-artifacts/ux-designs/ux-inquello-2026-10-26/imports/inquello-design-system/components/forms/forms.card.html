<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script><script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script><script src="../../components/preview-loader.js"></script></head><body style="margin:0;padding:20px 24px;background:#fff;box-sizing:border-box"><div id="root"></div><script type="text/babel">
IQ.ready.then(DS => { Object.assign(window, DS);
const Row = ({ label, children }) => <div style={{ display: 'grid', gridTemplateColumns: '92px minmax(0,1fr)', alignItems: 'center', gap: 12 }}><span style={{ font: 'var(--type-label)', letterSpacing: '.04em', color: 'var(--text-faint)', textTransform: 'uppercase' }}>{label}</span><div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>{children}</div></div>;
function Demo() { const [r, setR] = React.useState('open'); const [s1, setS1] = React.useState(true); const [s2, setS2] = React.useState(false); const [c1, setC1] = React.useState(true); const [c2, setC2] = React.useState(false); const [seg, setSeg] = React.useState('items'); const [txt, setTxt] = React.useState('Same payer and reference a day apart, but Arden Retail says two invoices were paid.');
return <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,1fr)', gap: 20 }}>
<div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}><TextField placeholder="Search threads and files" /><TextField multiline rows={3} label="Reason, saved with the decision" value={txt} onChange={setTxt} /><Switch checked={s1} onChange={setS1} label="Changes since v4" /><Switch checked={s2} onChange={setS2} label="Let Inquello look through the rest of this workspace" /><SegmentedControl value={seg} onChange={setSeg} options={[{ value: 'summary', label: 'Summary' }, { value: 'items', label: 'Reconciling items' }, { value: 'matched', label: 'Matched' }]} /></div>
<div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}><Choice checked={r === 'open'} onChange={() => setR('open')} label="Open item until Nordbank confirms" description="Keep the 500 in open items." /><Choice checked={r === 'dup'} onChange={() => setR('dup')} label="Duplicate bank entry" description="Bank to reverse; remove from the adjusted balance." /><Choice type="checkbox" checked={c1} onChange={setC1} label="Bank statement Sep 2026.pdf" /><Choice type="checkbox" checked={c2} onChange={setC2} label="Cash ledger Sep 2026.xlsx" /></div>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />); });
</script></body></html>
