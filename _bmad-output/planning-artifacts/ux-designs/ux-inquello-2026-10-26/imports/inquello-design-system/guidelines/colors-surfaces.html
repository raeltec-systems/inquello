<!-- @dsCard group="Colors" viewport="700x150" subtitle="Flat surfaces separated by 1px lines" name="Surfaces and borders" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:20px 24px;background:#fff;box-sizing:border-box"><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px"><div style="display:flex;flex-direction:column;gap:5px"><div style="height:52px;border-radius:6px;background:var(--surface-app);box-shadow:inset 0 0 0 1px rgba(22,25,29,.08)"></div><span style="font:400 9.5px var(--font-mono);color:var(--text-muted)">--surface-app</span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:52px;border-radius:6px;background:var(--surface-sidebar);box-shadow:inset 0 0 0 1px rgba(22,25,29,.08)"></div><span style="font:400 9.5px var(--font-mono);color:var(--text-muted)">--surface-sidebar</span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:52px;border-radius:6px;background:var(--surface-panel);box-shadow:inset 0 0 0 1px rgba(22,25,29,.08)"></div><span style="font:400 9.5px var(--font-mono);color:var(--text-muted)">--surface-panel</span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:52px;border-radius:6px;background:var(--surface-subtle);box-shadow:inset 0 0 0 1px rgba(22,25,29,.08)"></div><span style="font:400 9.5px var(--font-mono);color:var(--text-muted)">--surface-subtle</span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:52px;border-radius:6px;background:var(--surface-hover);box-shadow:inset 0 0 0 1px rgba(22,25,29,.08)"></div><span style="font:400 9.5px var(--font-mono);color:var(--text-muted)">--surface-hover</span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:52px;border-radius:6px;background:var(--surface-selected);box-shadow:inset 0 0 0 1px rgba(22,25,29,.08)"></div><span style="font:400 9.5px var(--font-mono);color:var(--text-muted)">--surface-selected</span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:52px;border-radius:6px;background:var(--surface-console);box-shadow:inset 0 0 0 1px rgba(22,25,29,.08)"></div><span style="font:400 9.5px var(--font-mono);color:var(--text-muted)">--surface-console</span></div></div><div style="display:flex;gap:18px;margin-top:14px"><div style="display:flex;align-items:center;gap:8px"><span style="width:44px;height:0;border-top:2px solid var(--border-subtle)"></span><span style="font:400 9.5px var(--font-mono);color:var(--text-muted)">--border-subtle</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:44px;height:0;border-top:2px solid var(--border-default)"></span><span style="font:400 9.5px var(--font-mono);color:var(--text-muted)">--border-default</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:44px;height:0;border-top:2px solid var(--border-strong)"></span><span style="font:400 9.5px var(--font-mono);color:var(--text-muted)">--border-strong</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:44px;height:0;border-top:2px solid var(--border-input)"></span><span style="font:400 9.5px var(--font-mono);color:var(--text-muted)">--border-input</span></div></div></body></html>
