<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:20px 24px;background:#fff;box-sizing:border-box"><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px"><div style="display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--border-default);border-radius:8px"><span style="display:flex;align-items:center;gap:6px;color:var(--judgment-calculation);font:500 10px var(--font-mono);letter-spacing:.04em;text-transform:uppercase"><span style="font:500 12px var(--font-mono)">ƒ</span>Calculation</span><span style="font:400 11.5px/1.4 var(--font-sans);color:var(--text-secondary)">150.00 = 4,750.00 − 4,600.00</span></div><div style="display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--border-default);border-radius:8px"><span style="display:flex;align-items:center;gap:6px;color:var(--judgment-observation);font:500 10px var(--font-mono);letter-spacing:.04em;text-transform:uppercase"><span style="font:600 13px var(--font-sans)">◦</span>Observation</span><span style="font:400 11.5px/1.4 var(--font-sans);color:var(--text-secondary)">Same payer and reference, one day apart</span></div><div style="display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--border-default);border-radius:8px"><span style="display:flex;align-items:center;gap:6px;color:var(--judgment-suggestion);font:500 10px var(--font-mono);letter-spacing:.04em;text-transform:uppercase"><span style="width:11px;height:8px;border:1px dashed var(--blue-600)"></span>Suggestion</span><span style="font:400 11.5px/1.4 var(--font-sans);color:var(--text-secondary)">Treat R1 as a duplicate bank entry</span></div><div style="display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--border-default);border-radius:8px"><span style="display:flex;align-items:center;gap:6px;color:var(--judgment-decision);font:500 10px var(--font-mono);letter-spacing:.04em;text-transform:uppercase"><span style="width:9px;height:9px;border-radius:50%;background:var(--green-600)"></span>Decision</span><span style="font:400 11.5px/1.4 var(--font-sans);color:var(--text-secondary)">Priya: keep open until Nordbank confirms</span></div><div style="display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--border-default);border-radius:8px"><span style="display:flex;align-items:center;gap:6px;color:var(--judgment-gap);font:500 10px var(--font-mono);letter-spacing:.04em;text-transform:uppercase"><span style="font:600 12px var(--font-sans)">–</span>Gap</span><span style="font:400 11.5px/1.4 var(--font-sans);color:var(--text-secondary)">October statement not in this workspace</span></div></div></body></html>
