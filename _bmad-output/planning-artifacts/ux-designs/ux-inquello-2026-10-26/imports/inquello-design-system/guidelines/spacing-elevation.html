<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:20px 24px;background:#fff;box-sizing:border-box"><div style="background:var(--surface-panel);border-radius:10px;padding:18px;display:flex;gap:16px"><div style="flex:1;height:72px;background:#fff;border-radius:8px;border:1px solid var(--border-default);box-shadow:var(--shadow-hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box"><span style="font:500 10px var(--font-mono);color:var(--text-secondary)">hairline</span><span style="font:400 10px var(--font-sans);color:var(--text-faint)">Cards, rows</span></div><div style="flex:1;height:72px;background:#fff;border-radius:8px;box-shadow:var(--shadow-composer);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box"><span style="font:500 10px var(--font-mono);color:var(--text-secondary)">composer</span><span style="font:400 10px var(--font-sans);color:var(--text-faint)">Composer</span></div><div style="flex:1;height:72px;background:#fff;border-radius:8px;box-shadow:var(--shadow-page);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box"><span style="font:500 10px var(--font-mono);color:var(--text-secondary)">page</span><span style="font:400 10px var(--font-sans);color:var(--text-faint)">Document page</span></div><div style="flex:1;height:72px;background:#fff;border-radius:8px;box-shadow:var(--shadow-popover);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box"><span style="font:500 10px var(--font-mono);color:var(--text-secondary)">popover</span><span style="font:400 10px var(--font-sans);color:var(--text-faint)">Menus</span></div><div style="flex:1;height:72px;background:var(--ink-900);border-radius:8px;box-shadow:var(--shadow-toast);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10
