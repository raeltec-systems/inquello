[package]
name = "inquello-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

# Wire schemas for Inquello's shared service: SC-1 identity bootstrap, refresh and
# session views, and the SC-2 command envelope, response and error kinds. The JSON
# conformance fixtures under fixtures/ are shared by the service and its clients.

[dependencies]
inquello-domain = { path = "../inquello-domain" }
serde_json = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
