[package]
name = "inquello-service"
version.workspace = true
edition.workspace = true
license.workspace = true

# Inquello's shared service (SC-1 identity and sessions, SC-2 principal-scoped
# session commands with durable receipts) on axum and sqlx/PostgreSQL. It runs
# only in the SC-7 synthetic topology for now: loopback plain HTTP, PostgreSQL 18
# test metadata and, behind the `test-issuer` feature, an in-process OIDC test
# issuer with ephemeral keys.

[features]
# The synthetic OIDC test issuer and the synthetic-test deployment. Without this
# feature no test issuer can be configured at all; with it, a production
# deployment still refuses one.
test-issuer = ["dep:ring"]

[dependencies]
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
base64 = { workspace = true }
chrono = { workspace = true }
inquello-domain = { workspace = true }
inquello-protocol = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
ring = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres"] }
sqlx-macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[[test]]
name = "identity"
required-features = ["test-issuer"]

[lints]
workspace = true
