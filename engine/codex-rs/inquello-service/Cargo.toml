[package]
name = "inquello-service"
version.workspace = true
edition.workspace = true
license.workspace = true

# Inquello's shared service (SC-1 identity and sessions, SC-2 principal-scoped
# session commands with durable receipts, Story 1.11 internal-company Workspaces,
# memberships, invites and Workspace-scoped commands, and the operator CLI) on
# axum and sqlx/PostgreSQL. It runs only in the SC-7 synthetic topology for now:
# HTTPS (rustls) or loopback plain HTTP, PostgreSQL 18 test metadata and, behind
# the `test-issuer` feature, an in-process OIDC test issuer with ephemeral keys,
# a synthetic OIDC provider, an ephemeral test CA and the `inquello-dev-topology`
# binary.

[features]
# Only selects cfg(test) retained-child coupling; never exposes a runtime route.
retained-fixtures = ["test-issuer", "dep:app_test_support", "dep:codex-app-server-protocol"]
# The synthetic OIDC test issuer and the synthetic-test deployment. Without this
# feature no test issuer can be configured at all; with it, a production
# deployment still refuses one.
test-issuer = ["dep:rcgen", "dep:ring", "dep:time", "dep:tracing-subscriber"]

[dependencies]
# Only the explicit retained-child fixture feature needs the desktop engine's
# test harness; ordinary service checks must remain a separate build.
app_test_support = { workspace = true, optional = true }
codex-app-server-protocol = { workspace = true, optional = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
base64 = { workspace = true }
chrono = { workspace = true }
inquello-domain = { workspace = true }
inquello-protocol = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rcgen = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres"] }
sqlx-macros = { workspace = true }
# All target drivers must implement the same SQLx Executor trait when retained
# test support enables query descriptions. No host-side query macros are needed.
sqlx-postgres = { workspace = true }
sqlx-sqlite = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true, features = ["fmt"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

# The operator CLI (`inquello-service admin ...`). It connects to PostgreSQL
# directly; no HTTP route reaches its commands.
[[bin]]
name = "inquello-service"
path = "src/bin/inquello-service.rs"

[[bin]]
name = "inquello-dev-topology"
path = "src/bin/inquello-dev-topology.rs"
required-features = ["test-issuer"]

[[test]]
name = "identity"
required-features = ["test-issuer"]

[[test]]
name = "topology"
required-features = ["test-issuer"]

[[test]]
name = "memberships"
required-features = ["test-issuer"]

[lints]
workspace = true

[[test]]
name = "route_eligibility"
required-features = ["test-issuer"]
